<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Entropy Service — Colours</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css">
</head>
<body class="page-colors" data-entropy-view="colors">
  <nav class="site-toolbar" aria-label="Site and appearance">
    <a href="/">Entropy Service</a>
    <button type="button" data-theme-toggle aria-pressed="false" hidden>Dark mode</button>
  </nav>
  <main class="color-shell">
    <p id="stream-notice" class="stream-notice" role="status" aria-live="polite" data-state="waiting">AWAITING FIRST SAMPLE</p>
    <p id="sample-info"></p>
    <div id="hash" class="hash color-hash">—</div>
    <p><a href="/">← Back to all endpoints</a></p>
  </main>
  <script src="/entropy-display.js" defer></script>
</body>
</html>
