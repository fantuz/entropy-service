<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Entropy Service — Random Bytes</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css">
</head>
<body class="page-bytes" data-entropy-view="bytes">
  <nav class="site-toolbar" aria-label="Site and appearance">
    <a href="/">Entropy Service</a>
    <button type="button" data-theme-toggle hidden>Dark mode</button>
  </nav>
  <main class="panel">
    <p id="stream-notice" class="stream-notice" role="status" aria-live="polite"
       data-state="waiting">AWAITING FIRST SAMPLE</p>
    <p id="sample-info" class="analysis-meta"></p>
    <section class="section" aria-labelledby="bytes-hex-title">
      <h3 id="bytes-hex-title">Hex preview</h3>
      <div class="hex" id="hex">—</div>
    </section>
    <section class="section" aria-labelledby="bytes-base64-title">
      <h3 id="bytes-base64-title">Base64 preview</h3>
      <div class="base64" id="base64">—</div>
    </section>
    <section class="section" aria-labelledby="bytes-sha-title">
      <h3 id="bytes-sha-title">SHA-256</h3>
      <div class="hash" id="hash">—</div>
    </section>
    <p><a href="/">← Back to all endpoints</a></p>
  </main>
  <script src="/display-clock.js" defer></script>
  <script src="/entropy-display.js" defer></script>
</body>
</html>
