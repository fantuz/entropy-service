<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Entropy Stream Service - Random Words</title>

<script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css">
</head>
<body class="page-words">
  <nav class="site-toolbar" aria-label="Site and appearance">
    <a href="/">Entropy Service</a>
    <button type="button" data-theme-toggle hidden>Dark mode</button>
  </nav>

<div class="panel">
    <form id="word-language-form" class="word-language-controls">
        <label for="word-language">Word language</label>
        <select id="word-language" name="lang" disabled><option value="en">Loading languages…</option></select>
        <button type="submit" id="word-language-apply" disabled>Apply</button>
    </form>
    <p id="wordlist-info" class="wordlist-info"></p>
    <p class="wordlist-info"><a href="/wordlist-notices.txt">Wordlist sources and licenses</a></p>
    <p id="stream-notice" class="stream-notice" role="status" aria-live="polite" data-state="waiting">AWAITING FIRST SAMPLE</p>
    <div class="section">
        <h3>Words</h3>
        <div id="words" class="words"><div id="words-content" class="words-content">—</div></div>
    </div>
    <div class="section">
        <h3>SHA256</h3>
        <div id="hash" class="data">—</div>
    </div>
</div>

<script src="/display-clock.js"></script>
<script src="/words-page.js"></script>

</body>
</html>
