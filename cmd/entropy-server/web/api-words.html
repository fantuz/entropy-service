<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Entropy Stream Service - Random Words</title>

<script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css">
</head>
<body class="page-words">
  <nav class="site-toolbar" aria-label="Site and appearance">
    <a href="/">Entropy Service</a>
    <button type="button" data-theme-toggle aria-pressed="false" hidden>Dark mode</button>
  </nav>

<div class="panel">
    <p id="stream-notice" class="stream-notice" role="status" aria-live="polite" data-state="waiting">AWAITING FIRST SAMPLE</p>
    <div class="section">
        <h3>Words</h3>
        <div id="words" class="words"><div id="words-content" class="words-content">—</div></div>
    </div>
    <div class="section">
        <h3>SHA256</h3>
        <div id="hash" class="data">—</div>
    </div>
</div>

<script src="/display-clock.js"></script>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const query = params.toString();
const status = document.getElementById("stream-notice");
const words = document.getElementById("words-content");
const hash = document.getElementById("hash");
const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host + "/words" + (query ? "?" + query : "")
);
let failed = false;
const displayClock = window.EntropyDisplayClock.create(paintLatest);

function setStatus(state, message) {
    status.hidden = false;
    status.dataset.state = state;
    status.textContent = message;
}

function paintLatest(data) {
    const phrase = document.createDocumentFragment();
    data.words.split(" ").forEach((word, i) => {
        if (i > 0) phrase.append(" ");
        const item = document.createElement("span");
        item.textContent = word;
        phrase.append(item);
    });
    words.replaceChildren(phrase);
    hash.textContent = data.hash;
    status.hidden = true;
}

ws.onopen = () => setStatus("waiting", "Awaiting first sample");
ws.onerror = () => {
    failed = true;
    setStatus("error", "Connection failed");
};
ws.onclose = () => {
    if (!failed) setStatus("disconnected", "Stream closed — reload to retry");
};
ws.onmessage = event => {
    try {
        const data = JSON.parse(event.data);
        if (typeof data.words !== "string" || typeof data.hash !== "string" ||
            !/^[0-9a-f]{64}$/.test(data.hash)) {
            throw new Error("Invalid words response");
        }
        displayClock.submit(data);
    } catch (error) {
        failed = true;
        setStatus("error", error.message);
        displayClock.cancel();
        ws.close(1002, "invalid words response");
    }
};
window.addEventListener("pagehide", () => { displayClock.cancel(); ws.close(); });
</script>

</body>
</html>
