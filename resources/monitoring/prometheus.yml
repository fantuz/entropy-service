# Example: bind Prometheus and the exporter privately. Adapt targets/job labels.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - entropy-alerts.yml
scrape_configs:
  - job_name: entropy-service
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]
  - job_name: entropy-service-https
    metrics_path: /probe
    params:
      module: [entropy_https]
    static_configs:
      - targets: ["https://localhost:8443/ready"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
