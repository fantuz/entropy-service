# Optional service drop-in; review permissions and state writes before enabling.
# Install under /etc/systemd/system/entropy-server.service.d/20-memory-hardening.conf
# This does NOT replace a dedicated unprivileged User= assignment, and
# LimitCORE=0 alone may not suppress a piped core_pattern collector.
[Service]
LimitCORE=0
NoNewPrivileges=yes
UMask=0077
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
# Not set: PrivateDevices=yes (the physical entropy device might vanish)
# Not set: User=... (must provision device/certificate permissions first)
# Configure ReadWritePaths= for any necessary service state directory.
