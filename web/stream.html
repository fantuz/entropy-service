<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Entropy Stream Service - Random Bytes Stream</title>
<style>
body {
    position:relative;
    margin: auto;
    font-family: "JetBrains Mono", monospace;
    #letter-spacing: 0.04em;
    #display: flex;
    #justify-content: center;
    text-align: center;
    align-items: center;
    #height: 100vh;
    background: grey;
    color: #00ff88;
    word-wrap: break-word;
    overflow: hidden;
    max-width: 50%;
    #transition: background 0.2s ease-in-out;
    #background: rgba(148, 0, 0, 1);
}

.section {
    margin-bottom: 15px;
}

.panel {
    position:relative;
    margin: auto;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(12px);
    padding: 20px;
    margin-top: 20px;
    margin-bottom: 20px;
    border-radius: 16px;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    max-width: 100%;
    word-wrap: break-word;
}

.data {
    color: #00ffcc;
    font-size: 1.1rem;
    line-height: 1.6;
}

.hex {
    opacity: 1;
    font-size: 1em;
    backdrop-filter: blur(12px);
    padding: 10px;
    color: #444;
    transition: opacity 0.2s ease-in-out;
    border-radius: 16px;
    font-family: "IBM Plex Mono", monospace;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    text-shadow: 0 0 8px rgba(0,255,200,0.4);
    #letter-spacing: 0.04em;
    background: rgba(255, 255, 255, 0.85);
}

.hex.out {
    opacity: 0;
}

h3 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    opacity: 0.6;
}
</style>
</head>
<body>

<div class="panel">
    <h3>Shannon Entropy Index: <span id="entropy">0</span></h3>
    </br>
    <div class="hex" id="hex">cumulative distribution of values obtained via Websockets JSON BLOB</br></br>
	<canvas id="histogram" width="800" height="75"></canvas>
    </div>
    </br>
    <div class="hex" id="hex">RGB mosaic</br></br>
	<canvas id="mosaic" width="800" height="48"></canvas>
    </div>
    </br>
    <div class="hex" id="hex">0/1 distribution</br></br>
	<canvas id="pie" width="150" height="150"></canvas>
    </div>
    </br>
    <div class="hex" id="hex">input waveform sample (live oscilloscope)</br></br>
	<canvas id="wave" width="800" height="200"></canvas>
    </div>
    </br>
    <div class="hex" id="hex">Fast Fourier Transformation (FFT) <span id="fftvalue">not running</span></br></br>
	<canvas id="fft" width="800" height="75"></canvas>
    </div>
    </br>
</div>

<script>
const queryString = window.location.search;
const urlParams = new URLSearchParams(queryString);
const bytes = urlParams.get('bytes')
const refresh = urlParams.get('refresh')

const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") 
    + location.host + "/stream?bytes=" + bytes + "&refresh=" + refresh
);
ws.binaryType = "arraybuffer";

let ones = 0;
let zeros = 0;
let totalBytes = 0;

const histogram = new Array(512).fill(0);
const canvas = document.getElementById("histogram");
const ctx = canvas.getContext("2d");

function computeEntropy(histogram, total) {
    if (total === 0) return 0;

    let entropy = 0;

    for (let count of histogram) {
        if (count === 0) continue;

        const p = count / total;
        entropy -= p * Math.log2(p);
    }

    return entropy;
}

function renderHistogram() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const max = Math.max(...histogram);
    const barWidth = canvas.width / 256;

    for (let i = 0; i < 512; i++) {
        const height = (histogram[i] / max) * canvas.height;

        ctx.fillStyle = "#00aacc";
        ctx.fillRect(
            i * barWidth,
            canvas.height - height,
            barWidth,
            100 - height
        );
    }
}

const pieCanvas = document.getElementById("pie");
const pieCtx = pieCanvas.getContext("2d");

function renderPie() {
    const total = ones + zeros;
    if (total === 0) return;

    const zeroAngle = (zeros / total) * 2 * Math.PI;

    pieCtx.clearRect(0, 0, 75, 75);

    // zeros slice
    pieCtx.beginPath();
    pieCtx.moveTo(75, 75);
    pieCtx.arc(75, 75, 60, 0, zeroAngle);
    pieCtx.fillStyle = "#000000";
    pieCtx.fill();

    // ones slice
    pieCtx.beginPath();
    pieCtx.moveTo(75, 75);
    pieCtx.arc(75, 75, 60, zeroAngle, 2 * Math.PI);
    pieCtx.fillStyle = "#ffffcc";
    pieCtx.fill();
}

const mosaicCanvas = document.getElementById("mosaic");
const mosaicCtx = mosaicCanvas.getContext("2d");

function renderMosaic(bytes) {

    const tileSize = 16;
    let x = 0;
    let y = 0;

    mosaicCtx.clearRect(0, 0, 800, 200);

    for (let i = 0; i < bytes.length - 2; i += 3) {

        const r = bytes[i];
        const g = bytes[i+1];
        const b = bytes[i+2];

        mosaicCtx.fillStyle = `rgb(${r},${g},${b})`;
        mosaicCtx.fillRect(x, y, tileSize, tileSize);

        x += tileSize;

        if (x >= 800) {
            x = 0;
            y += tileSize;
        }

        if (y >= 48) break;
    }
}

const waveCanvas = document.getElementById("wave");
const waveCtx = waveCanvas.getContext("2d");

function renderWave(bytes) {

    waveCtx.clearRect(0, 0, 800, 250);
    waveCtx.beginPath();

    //const step = 800 / bytes.length;
    const step = 10;

    for (let i = 0; i < bytes.length; i++) {
        const x = i * step;
        const y = 200 - (bytes[i] / 255) * 200;

        if (i === 0)
            waveCtx.moveTo(x, y);
        else
            waveCtx.lineTo(x, y);
	//if (i > 800)
	//    return
    }

    waveCtx.strokeStyle = "#00ff55";
    waveCtx.stroke();
}

let frameCounter = 0;
const fftCanvas = document.getElementById("fft");
const fftCtx = fftCanvas.getContext("2d");
const FFT_SIZE = 1024;

function fft(real, imag) {
    const n = real.length;

    if (n <= 1) return;

    // divide
    const half = n / 2;
    const evenReal = new Array(half);
    const evenImag = new Array(half);
    const oddReal  = new Array(half);
    const oddImag  = new Array(half);

    for (let i = 0; i < half; i++) {
        evenReal[i] = real[i*2];
        evenImag[i] = imag[i*2];
        oddReal[i]  = real[i*2+1];
        oddImag[i]  = imag[i*2+1];
    }

    fft(evenReal, evenImag);
    fft(oddReal, oddImag);

    // conquer
    for (let k = 0; k < half; k++) {
        const angle = -2 * Math.PI * k / n;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);

        const tre =  cos * oddReal[k] - sin * oddImag[k];
        const tim =  sin * oddReal[k] + cos * oddImag[k];

        real[k]       = evenReal[k] + tre;
        imag[k]       = evenImag[k] + tim;
        real[k+half]  = evenReal[k] - tre;
        imag[k+half]  = evenImag[k] - tim;
    }
}

/*
    const out = fft.createComplexArray();
    fft.realTransform(out, input);
    fft.completeSpectrum(out);
*/

function renderFFT(bytes) {

    if (bytes.length < FFT_SIZE) return;

    const real = new Array(FFT_SIZE);
    const imag = new Array(FFT_SIZE).fill(0);

    // Center signal around zero (-128..127)
    for (let i = 0; i < FFT_SIZE; i++) {
        real[i] = bytes[i] - 128;
    }

    fft(real, imag);

    fftCtx.clearRect(0, 0, 800, 150);

    const half = FFT_SIZE / 2;
    const barWidth = 800 / half;

    for (let i = 0; i < half; i++) {

        const magnitude = Math.sqrt(
            real[i]*real[i] + imag[i]*imag[i]
        );

        // Convert to decibel scale for better visualization
        const db = 20 * Math.log10(magnitude + 1);
        const height = db * 2; // scaling factor
        //const re = out[2*i];
        //const im = out[2*i+1];
        //const height = magnitude * 0.01; // scaling
        //const magnitude = Math.sqrt(re*re + im*im);

        fftCtx.fillStyle = "#00ffcc";
        fftCtx.fillRect(
            i * barWidth,
            //height,
            150 - height*2,
            barWidth*1,
            height
        );
    }
}

//ws.onmessage = function(event)
//ws.onmessage = async (event)
ws.onmessage = (event) => {
    const buffer = event.data;
    const bytes = new Uint8Array(buffer);
    const fftvalue = 3;

    //const buffer = await event.data.arrayBuffer();
    //const hex = document.getElementById("hex");

/*
    // derive color from first 3 bytes of hex
    const r = parseInt(bytes.slice(0,2),16);
    const g = parseInt(bytes.slice(2,4),16);
    const b = parseInt(bytes.slice(4,6),16);

    //hex.classList.add("out");
    setTimeout(() => {
        //hex.textContent = data.base64;
        //hex.classList.remove("out");
        document.body.style.backgroundColor =
            `rgb(${r/2},${g/2},${b/2})`;
    }, 500);
*/

    for (let b of bytes) {
        histogram[b]++;
        totalBytes++;

        for (let i = 0; i < 8; i++) {
            if (b & (1 << i)) ones++;
            else zeros++;
        }
    }

    /*
    for (let i = 0; i < bytes.length; i++) {
        histogram[bytes[i]]++;
    }
    */

    renderHistogram();
    renderMosaic(bytes);
    renderPie();
    renderWave(bytes);

    const entropy = computeEntropy(histogram, totalBytes);

    document.getElementById("entropy").textContent =
        entropy.toFixed(5) + " / 8 bits (" + ((100*entropy)/8).toFixed(3) + "%)";

    //console.log(bytes); // raw entropy bytes
    //console.log(totalBytes);

    // clear histogram cache over time
    if (totalBytes >= 4194304) {
        histogram.fill(0);
        totalBytes = 0;
        ones = 0;
        zeros = 0;
    }
    //histogram[byte] = (histogram[byte] + 1) % 10000;

    if (++frameCounter % fftvalue === 0) {
        renderFFT(bytes);
    	document.getElementById("fftvalue").textContent =
	" every " + fftvalue + " frames";
    }

};

</script>

</body>
</html>
