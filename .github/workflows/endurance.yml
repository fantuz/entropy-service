name: Endurance and fault tests
on:
  workflow_call:
    inputs:
      full:
        description: Run complete validation; false is reserved for the conservative PR documentation plan
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      duration:
        description: Duration per scenario (three scenarios plus build/cleanup)
        type: choice
        options:
          - 1m
          - 10m
          - 30m
          - 1h
        default: 10m
      workers:
        description: Concurrent mixed HTTP/WebSocket workers per backend
        type: choice
        options:
          - '2'
          - '4'
          - '8'
        default: '4'
permissions:
  contents: read
concurrency:
  group: endurance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: true
jobs:
  endurance:
    name: Endurance (${{ matrix.os }})
    runs-on: ${{ (github.event_name == 'workflow_dispatch' || inputs.full) && matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            race: 'true'
          - os: windows-2025
            race: 'false'
    env:
      DURATION: ${{ inputs.duration || '5s' }}
      WORKERS: ${{ inputs.workers || '2' }}
      RUN_RACE: ${{ matrix.race }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Report documentation fast path
        if: ${{ !(github.event_name == 'workflow_dispatch' || inputs.full) }}
        run: python3 scripts/check_release_downloads.py
      - name: Setup Go and workload input caches
        uses: ./.github/actions/setup-go-cache
        with:
          profile: endurance
        if: (github.event_name == 'workflow_dispatch' || inputs.full)
      - name: Check evidence completeness rules
        run: python -m unittest discover -s scripts -p 'test_run_endurance.py'
        if: (github.event_name == 'workflow_dispatch' || inputs.full)
      - name: Run mixed traffic, source faults and joined cleanup
        shell: bash
        run: |
          race_args=()
          if [[ "$RUN_RACE" == "true" ]]; then race_args+=(--race); fi
          python scripts/run_endurance.py --duration "$DURATION" --workers "$WORKERS" \
            --artifacts endurance-artifacts "${race_args[@]}"
        if: (github.event_name == 'workflow_dispatch' || inputs.full)
      - name: Preserve results and failure logs
        if: (github.event_name == 'workflow_dispatch' || inputs.full) && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: endurance-${{ matrix.os }}
          path: |
            endurance-artifacts/*.json
            endurance-artifacts/*.log
          if-no-files-found: error
          retention-days: 14
