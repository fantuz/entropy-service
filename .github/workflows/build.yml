name: build
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml
  docs:
    uses: ./.github/workflows/ci-docs.yml
  quality:
    name: Linux quality
    needs:
      - plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/linux-checks.yml
    with:
      suite: quality
  fuzz:
    name: Linux fuzz
    needs:
      - plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/linux-checks.yml
    with:
      suite: fuzz
  race:
    name: Linux race
    needs:
      - plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/linux-checks.yml
    with:
      suite: race
  terminal:
    name: Linux terminal
    needs:
      - plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/linux-checks.yml
    with:
      suite: terminal
  packages:
    name: Create tested archives early
    needs:
      - plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/package-snapshot.yml
  containers:
    name: Container images
    uses: ./.github/workflows/container-build.yml
    with:
      version: edge
      full: ${{ needs.plan.outputs.mode == 'full' }}
    needs:
      - plan
  endurance:
    name: Endurance and fault tests
    uses: ./.github/workflows/endurance.yml
    needs:
      - plan
    with:
      full: ${{ needs.plan.outputs.mode == 'full' }}
  windows:
    name: Optional Windows port
    uses: ./.github/workflows/windows.yml
    needs:
      - plan
    with:
      full: ${{ needs.plan.outputs.mode == 'full' }}
  windows-package:
    name: Packaged Windows archive
    needs:
      - plan
      - packages
    uses: ./.github/workflows/windows-package.yml
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'docs' || needs.packages.result == 'success') }}
    with:
      full: ${{ needs.plan.outputs.mode == 'full' }}
  macos:
    name: Native macOS
    needs: [plan, packages]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'docs' || needs.packages.result == 'success') }}
    uses: ./.github/workflows/macos.yml
    with:
      full: ${{ needs.plan.outputs.mode == 'full' }}
  build:
    # Inspect failed and skipped dependencies, but release the runner on cancellation.
    if: ${{ !cancelled() }}
    needs:
      - plan
      - docs
      - quality
      - fuzz
      - race
      - terminal
      - packages
      - containers
      - endurance
      - windows
      - windows-package
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout matching source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require every planned validation result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_MODE: ${{ needs.plan.outputs.mode }}
        run: python3 scripts/ci_gate.py --mode "$CI_MODE" --required plan docs quality fuzz race terminal packages containers endurance windows windows-package macos --docs-skips quality fuzz
          race terminal packages
  publish-containers:
    name: Publish validated main images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - windows
      - windows-package
      - endurance
      - containers
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-publish.yml
    with:
      tag: edge
      source_sha: ${{ github.sha }}
