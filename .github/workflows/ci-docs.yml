name: Validate documentation, release tooling and CI policy
on:
  workflow_call:
    inputs:
      release_tag:
        description: Normal releases must match the exact VERSION tag
        type: string
        default: ''
permissions:
  contents: read
jobs:
  docs:
    name: Documentation and CI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout matching source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact release source when requested
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/ci_release_tag.py
      - name: Setup Python and pip download cache
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - name: Install pinned workflow validation dependency
        run: python -m pip install -r .github/ci-requirements.txt
      - name: Validate latest download links and alias configuration
        run: |
          python3 scripts/check_release_downloads.py
          python3 -m unittest discover -s scripts -p 'test_check_release_downloads.py'
          python3 -m unittest discover -s scripts -p 'test_prepare_gui_release.py'
          python3 -m unittest discover -s scripts -p 'test_validate_release_recovery.py'
      - name: Reject tracked TLS identities and private keys
        run: |
          python3 scripts/check_credential_files.py
          python3 -m unittest discover -s scripts -p 'test_check_credential_files.py'
      - name: Exercise plan, gate, cache policy and workflow contracts
        run: python3 -m unittest discover -s scripts -p 'test_ci_*.py'
      - name: Lint every GitHub workflow with pinned actionlint
        run: |
          curl --fail --location --silent --show-error --retry 2   https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz   -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes=''
