name: release
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to recover (leave blank for normal tagged release)
        type: string
        required: false
        default: ''
      validated_run_id:
        description: Failed release run whose validation jobs all succeeded; reuse its tested assets
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  recover-publication:
    if: github.event_name == 'workflow_dispatch' && inputs.validated_run_id != ''
    permissions:
      contents: write
      actions: read
      packages: write
    uses: ./.github/workflows/release-recovery.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      validated_run_id: ${{ inputs.validated_run_id }}
  gui-installer:
    if: inputs.validated_run_id == ''
    name: Validate bundled Windows GUI installer
    uses: ./.github/workflows/windows-gui-installer.yml
    with:
      release_tag: ${{ github.ref_name }}
  containers:
    if: inputs.validated_run_id == ''
    name: Validate container images before publishing
    uses: ./.github/workflows/container-build.yml
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
  publish-containers:
    if: inputs.validated_run_id == ''
    name: Publish released images to GHCR
    needs:
      - release
      - containers
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-publish.yml
    with:
      tag: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}
  endurance:
    if: inputs.validated_run_id == ''
    name: Validate endurance before publishing
    uses: ./.github/workflows/endurance.yml
  windows:
    if: inputs.validated_run_id == ''
    name: Validate Windows before publishing
    uses: ./.github/workflows/windows.yml
  windows-package:
    if: inputs.validated_run_id == ''
    name: Validate packaged Windows archive
    needs:
      - packages
    uses: ./.github/workflows/windows-package.yml
  validate:
    name: Validate tagged commit before publishing
    if: always() && (inputs.validated_run_id == '')
    needs:
      - docs
      - quality
      - fuzz
      - race
      - terminal
      - packages
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout matching source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact VERSION tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/ci_release_tag.py
      - name: Require every tagged Linux validation result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py --mode full --required docs quality fuzz race terminal packages
  browser:
    if: inputs.validated_run_id == ''
    name: Validate Firefox and Chromium UI
    uses: ./.github/workflows/browser-ui.yml
  release:
    if: inputs.validated_run_id == ''
    name: Publish only after full tag validation
    needs:
      - validate
      - browser
      - windows
      - windows-package
      - endurance
      - containers
      - gui-installer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go and workload input caches
        uses: ./.github/actions/setup-go-cache
        with:
          profile: publication
      - name: Download this run's tested installer and complete runtime source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-gui-installer-and-sources
          path: bin/gui-release
      - name: Download this run's tested offline OCI bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: container-oci-bundles
          path: bin/oci-release
      - name: Verify tagged installer artifacts and prepare publication config
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/prepare_gui_release.py prepare --artifacts bin/gui-release --oci-artifacts bin/oci-release --repository "$GITHUB_REPOSITORY" \
            --version "${RELEASE_TAG#v}" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/goreleaser-release.yml"
      - name: Select curated release notes when available
        id: release-notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_notes_path="docs/releases/$RELEASE_TAG.md"
            if [[ -f "$release_notes_path" ]]; then
              printf 'args=--release-notes=%s\n' "$release_notes_path" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.17.0
          args: release --clean --config "${{ runner.temp }}/goreleaser-release.yml" ${{ steps.release-notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  quality:
    name: Validate Linux quality
    if: inputs.validated_run_id == ''
    uses: ./.github/workflows/linux-checks.yml
    with:
      suite: quality
      release_tag: ${{ github.ref_name }}
  fuzz:
    name: Validate Linux fuzz
    if: inputs.validated_run_id == ''
    uses: ./.github/workflows/linux-checks.yml
    with:
      suite: fuzz
      release_tag: ${{ github.ref_name }}
  race:
    name: Validate Linux race
    if: inputs.validated_run_id == ''
    uses: ./.github/workflows/linux-checks.yml
    with:
      suite: race
      release_tag: ${{ github.ref_name }}
  terminal:
    name: Validate Linux terminal
    if: inputs.validated_run_id == ''
    uses: ./.github/workflows/linux-checks.yml
    with:
      suite: terminal
      release_tag: ${{ github.ref_name }}
  docs:
    name: Validate documentation and CI policy
    if: inputs.validated_run_id == ''
    uses: ./.github/workflows/ci-docs.yml
    with:
      release_tag: ${{ github.ref_name }}
  packages:
    name: Create tested archives early
    if: inputs.validated_run_id == ''
    uses: ./.github/workflows/package-snapshot.yml
    with:
      release_tag: ${{ github.ref_name }}
