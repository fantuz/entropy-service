---
name: release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  endurance:
    name: Validate endurance before publishing
    uses: ./.github/workflows/endurance.yml

  windows:
    name: Validate Windows before publishing
    uses: ./.github/workflows/windows.yml

  windows-package:
    name: Validate packaged Windows archive
    needs: [validate, windows]
    uses: ./.github/workflows/windows-package.yml

  validate:
    name: Validate tagged commit before publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Reject tracked TLS identities and private keys
        run: |
          python3 scripts/check_credential_files.py
          python3 -m unittest discover -s scripts -p 'test_check_credential_files.py'
      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - name: Ensure go.mod is already tidied
        run: go mod tidy -diff
      - name: Verify cached module checksums
        run: go mod verify
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Run Go tests and collect coverage
        run: make coverage
      - name: Summarize Go statement coverage
        run: |
          {
            printf '### Go statement coverage\n\n```text\n'
            awk '/^total:/' coverage/summary.txt
            printf '```\n\nFull profile, per-function summary and HTML: `go-coverage` artifact (14 days).\n'
            printf 'Statement coverage measures exercised code, not cryptographic assurance.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Go coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Vet all Go packages
        run: go vet ./...
      - name: Exercise bounded parser and protocol fuzz targets
        env:
          GENERATION_FUZZTIME: 500000x
        run: bash scripts/test-fuzz.sh
      - name: Test actual executable startup failures and clean exits
        run: |
          make build
          python3 scripts/test_startup_failures.py
      - name: Verify client TLS trust and server identity replacement
        run: python3 scripts/test_client_tls.py
      - name: Test pure-Go DRBG and CPU-random fallback
        run: go test -tags=purego ./cmd/entropy-server/internal/drbg ./cmd/entropy-server/internal/rdrand
      - name: Race-test opt-in experimental Barzakh backend
        run: go test -race -tags=experimental_barzakh ./cmd/entropy-server/internal/drbg ./cmd/entropy-server/internal/config ./cmd/entropy-server
      - name: Validate monitoring configuration and alert behavior
        run: bash scripts/test-monitoring.sh
      - name: Verify pinned wordlists and multilingual word controls
        run: |
          python3 scripts/check-wordlists.py
          python3 -m unittest discover -s scripts -p 'test_check_wordlists.py'
          node scripts/test-word-languages.mjs
      - name: Test browser KPI calculations
        run: node scripts/test-status-kpis.mjs
      - name: Test status refresh scheduling
        run: node scripts/test-status-refresh.mjs
      - name: Test 20-FPS display pacing and controls
        run: node scripts/test-display-clock.mjs
      - name: Test shared analysis mathematics and worker
        run: node scripts/test-analysis-math.mjs
      - name: Test stream Shannon entropy alerts
        run: node scripts/test-stream-entropy-alert.mjs
      - name: Test experimental lab generators and meters
        run: |
          node scripts/test-lab-samples.mjs
          node scripts/test-lab-audio.mjs
      - name: Test assisted source configuration
        run: node scripts/test-lab-registration.mjs
      - name: Check shared analysis markup
        run: node scripts/render-analysis-pages.mjs --check
      - name: Test browser layout and digest formatting
        run: node scripts/test-web-layout.mjs
      - name: Test shared appearance and lab help
        run: node scripts/test-theme.mjs
      - name: Test synchronized HTTP gallery
        run: node scripts/test_gallery.mjs
      - name: Test statistical capture and report contracts
        run: python3 -m unittest discover -s scripts -p 'test_capture_randomness.py'
      - name: Race-test all Go packages
        run: make test-race
      - name: Smoke-test 20-FPS terminal redraws
        run: |
          make build-client
          python3 scripts/test_client_20fps.py
      - name: Smoke-test fullscreen waterfall and unusual terminal proportions
        run: python3 scripts/test_client_waterfall.py
      - name: Smoke-test packaged service configuration
        run: sh scripts/test-package-service.sh
      - name: Smoke-test client binary exports and retries
        run: python3 scripts/test_client_output.py
      - name: Run linters
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --timeout=3m0s
      - name: Validate snapshot packaging
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: v2.17.0
          args: release --snapshot --skip=publish --clean
      - name: Test real packaged systemd HTTP and HTTPS lifecycle
        run: sudo env ENTROPY_SYSTEMD_TEST=1 bash scripts/test-systemd-service.sh dist/*_amd64.deb
      - name: Verify Windows release ZIP layout, notices and executable architecture
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_windows_archive.py'
          python3 scripts/check_windows_archive.py dist/*_windows_amd64.zip
      - name: Preserve Windows release ZIP for native package tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release-zip
          path: dist/*_windows_amd64.zip
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Validate Firefox and Chromium UI
    uses: ./.github/workflows/browser-ui.yml

  release:
    name: Publish only after full tag validation
    needs: [validate, browser, windows, windows-package, endurance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
