name: Bound CI input caches
on:
  schedule:
    - cron: 17 5 * * 1
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report candidates without deleting caches
        type: boolean
        default: true
  pull_request_target:
    types:
      - closed
permissions:
  contents: read
  actions: write
  pull-requests: read
concurrency:
  group: cache-maintenance
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout matching source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Clean only confirmed closed PRs and excess main compiler snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          CLOSED_PR: ${{ github.event.pull_request.number }}
        run: |
          args=(--max-delete 100)
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DRY_RUN" != false ]]; then args+=(--dry-run); fi
          if [[ "$EVENT_NAME" == pull_request_target ]]; then args+=(--closed-pr "$CLOSED_PR"); fi
          python3 scripts/ci_cache_cleanup.py "${args[@]}"
