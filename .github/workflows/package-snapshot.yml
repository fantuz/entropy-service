name: Build and validate same-run release archives
on:
  workflow_call:
    inputs:
      release_tag:
        description: Normal releases must match the exact VERSION tag
        type: string
        default: ''
permissions:
  contents: read
jobs:
  package:
    name: Snapshot archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout matching source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact release source when requested
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/ci_release_tag.py
      - name: Setup Go and workload input caches
        uses: ./.github/actions/setup-go-cache
        with:
          profile: packages
      - name: Verify package module checksums
        run: go mod verify
      - name: Select release version or local CI rehearsal tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          if [[ -z "$tag" ]]; then
            tag="v$(cat VERSION)-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git tag "$tag" "$GITHUB_SHA"
          fi
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          echo "NATIVE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Build with Goreleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        env:
          GORELEASER_CURRENT_TAG: ${{ env.NATIVE_TAG }}
        with:
          version: v2.17.0
          args: release --skip=publish --clean
      - name: Verify download aliases and checksum coverage against actual archives
        run: python3 scripts/check_release_downloads.py --dist dist
      - name: Exercise actual GoReleaser GUI asset globbing and checksums
        run: python3 scripts/test_gui_goreleaser_integration.py --goreleaser "$RUNNER_TOOL_CACHE/goreleaser-checksum/2.17.0/x64/goreleaser"
      - name: Stage final native packages and rehearse checksum-preserving promotion
        run: |
          python3 scripts/native_release.py stage --native bin/native-release --version "${NATIVE_TAG#v}" --source-sha "$GITHUB_SHA"
          python3 scripts/native_release.py rehearse --native bin/native-release --version "${NATIVE_TAG#v}" --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/native-dry-run.yml"
      - name: Exercise publication without rebuilding or uploading
        uses: goreleaser/goreleaser-action@v7.3.0
        env:
          GORELEASER_CURRENT_TAG: ${{ env.NATIVE_TAG }}
        with:
          version: v2.17.0
          args: release --clean --skip=publish --config "${{ runner.temp }}/native-dry-run.yml"
      - name: Check all native publication checksums
        run: diff <(sort bin/native-release/checksums.txt) <(sort bin/publication-dist/checksums.txt)
      - name: Verify packaged Linux GUI launchers and modules
        run: |
          if ! command -v rpm2cpio >/dev/null || ! command -v cpio >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends rpm2cpio cpio
          fi
          bash scripts/test-linux-gui-packages.sh bin/native-release/*_amd64.deb bin/native-release/*_amd64.rpm
      - name: Test real packaged systemd HTTP and HTTPS lifecycle
        run: sudo env ENTROPY_SYSTEMD_TEST=1 bash scripts/test-systemd-service.sh bin/native-release/*_amd64.deb
      - name: Verify Windows release ZIP layout, notices and executable architecture
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_windows_archive.py'
          python3 scripts/check_windows_archive.py bin/native-release/*_windows_amd64.zip
      - name: Preserve the validated native release payloads and build metadata
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-release-payloads
          compression-level: 0
          path: bin/native-release/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve macOS archives for native Intel and Apple Silicon tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-cli-archives
          compression-level: 0
          path: |
            bin/native-release/*_darwin_*.tar.gz
            bin/native-release/checksums.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Windows release ZIP for native package tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-x64-release-zip
          compression-level: 0
          path: |
            bin/native-release/*_windows_amd64.zip
            bin/native-release/checksums.txt
          if-no-files-found: error
          retention-days: 7
