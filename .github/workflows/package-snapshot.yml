name: Build and validate same-run release archives
on:
  workflow_call:
    inputs:
      release_tag:
        description: Normal releases must match the exact VERSION tag
        type: string
        default: ''
permissions:
  contents: read
jobs:
  package:
    name: Snapshot archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout matching source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact release source when requested
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/ci_release_tag.py
      - name: Setup Go and workload input caches
        uses: ./.github/actions/setup-go-cache
        with:
          profile: packages
      - name: Verify package module checksums
        run: go mod verify
      - name: Build with Goreleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.17.0
          args: release --snapshot --skip=publish --clean
      - name: Verify download aliases and checksum coverage against actual archives
        run: python3 scripts/check_release_downloads.py --dist dist
      - name: Exercise actual GoReleaser GUI asset globbing and checksums
        run: python3 scripts/test_gui_goreleaser_integration.py --goreleaser "$RUNNER_TOOL_CACHE/goreleaser-checksum/2.17.0/x64/goreleaser"
      - name: Test real packaged systemd HTTP and HTTPS lifecycle
        run: sudo env ENTROPY_SYSTEMD_TEST=1 bash scripts/test-systemd-service.sh dist/*_amd64.deb
      - name: Verify Windows release ZIP layout, notices and executable architecture
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_windows_archive.py'
          python3 scripts/check_windows_archive.py dist/*_windows_amd64.zip
      - name: Preserve macOS archives for native Intel and Apple Silicon tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-cli-archives
          path: |
            dist/*_darwin_*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Windows release ZIP for native package tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-x64-release-zip
          path: dist/*_windows_amd64.zip
          if-no-files-found: error
          retention-days: 7
