name: browser-ui

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", ".gitignore"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser UI (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - name: Build browser test server
        run: |
          mkdir -p bin
          go build -o bin/entropy-server ./cmd/entropy-server
      - name: Install pinned browser test tools
        run: |
          # APT needs lowercase proxy variables, including after sudo. Do not
          # print their values: a configured proxy can contain credentials.
          export http_proxy="${http_proxy:-${HTTP_PROXY:-}}"
          export https_proxy="${https_proxy:-${HTTPS_PROXY:-}}"
          export no_proxy="${no_proxy:-${NO_PROXY:-}}"
          # Use direct HTTPS sources rather than mirror+file redirects. Keep
          # suites, components and Signed-By unchanged; never disable signing.
          sudo python3 - <<'PY'
          from pathlib import Path
          sources = [Path('/etc/apt/sources.list')]
          directory = Path('/etc/apt/sources.list.d')
          sources.extend(directory.glob('*.list'))
          sources.extend(directory.glob('*.sources'))
          for source in sources:
              if not source.is_file():
                  continue
              original = source.read_text()
              updated = original.replace('mirror+file:/etc/apt/apt-mirrors.txt', 'https://archive.ubuntu.com/ubuntu')
              updated = updated.replace('mirror+file:/etc/apt/apt-security-mirrors.txt', 'https://security.ubuntu.com/ubuntu')
              if updated != original:
                  source.write_text(updated)
          Path('/etc/apt/apt.conf.d/80entropy-browser-ci').write_text(
              'Acquire::Retries "2";\nAcquire::http::Timeout "10";\n'
              'Acquire::https::Timeout "10";\nAPT::Update::Error-Mode "any";\n')
          PY
          python3 -m venv /tmp/entropy-browser-tests
          /tmp/entropy-browser-tests/bin/pip install playwright==1.62.0
          sudo --preserve-env=http_proxy,https_proxy,no_proxy,SSL_CERT_FILE,SSL_CERT_DIR,REQUESTS_CA_BUNDLE \
            /tmp/entropy-browser-tests/bin/python -m playwright install-deps ${{ matrix.browser }}
          /tmp/entropy-browser-tests/bin/python -m playwright install ${{ matrix.browser }}
      - name: Provide a virtual audio output for headless Firefox
        if: matrix.browser == 'firefox'
        run: |
          export http_proxy="${http_proxy:-${HTTP_PROXY:-}}"
          export https_proxy="${https_proxy:-${HTTPS_PROXY:-}}"
          export no_proxy="${no_proxy:-${NO_PROXY:-}}"
          sudo --preserve-env=http_proxy,https_proxy,no_proxy,SSL_CERT_FILE,SSL_CERT_DIR,REQUESTS_CA_BUNDLE apt-get update
          sudo --preserve-env=http_proxy,https_proxy,no_proxy,SSL_CERT_FILE,SSL_CERT_DIR,REQUESTS_CA_BUNDLE \
            apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=entropy_test_output
          pactl set-default-sink entropy_test_output
      - name: Test appearance, window restoration and responsive layout
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_theme_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/theme
      - name: Test source and socket controls with fake media
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_sources_browser.py --browser ${{ matrix.browser }} --chromium '' --artifacts browser-artifacts/sources
      - name: Test structure, spectral history and PCM diagnostic views
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_diagnostics_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/diagnostics
      - name: Test graph palettes, persistence and raw-data invariance
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_graph_palettes_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/palettes
      - name: Test interface languages, saved choices and payload invariance
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_ui_languages_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/languages
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-ui-${{ matrix.browser }}
          path: browser-artifacts/
          retention-days: 7
          if-no-files-found: ignore
