name: browser-ui
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_call: null
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: browser-ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml
  browser:
    name: Browser UI (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require a successful recognized plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CI_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          test "$PLAN_RESULT" = success
          case "$CI_MODE" in full|docs) ;; *) exit 1 ;; esac
      - name: Report documentation fast path
        if: needs.plan.outputs.mode == 'docs'
        run: python3 scripts/check_release_downloads.py
      - name: Setup Go and workload input caches
        uses: ./.github/actions/setup-go-cache
        with:
          profile: browser
        if: needs.plan.outputs.mode == 'full'
      - name: Build browser test server
        run: |
          mkdir -p bin
          go build -o bin/entropy-server ./cmd/entropy-server
        if: needs.plan.outputs.mode == 'full'
      - name: Setup Python and pip download cache
        if: needs.plan.outputs.mode == 'full'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/browser-requirements.txt
      - name: Install exact Playwright Python package
        if: needs.plan.outputs.mode == 'full'
        id: playwright
        run: |
          python3 -m venv /tmp/entropy-browser-tests
          /tmp/entropy-browser-tests/bin/pip install -r scripts/browser-requirements.txt
          /tmp/entropy-browser-tests/bin/python - <<'PY'
          import importlib.metadata
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + importlib.metadata.version('playwright') + '\n')
          PY
      - name: Cache pinned browser downloads by engine
        if: needs.plan.outputs.mode == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/ms-playwright/${{ matrix.browser }}-*
            ~/.cache/ms-playwright/chromium_headless_shell-*
            ~/.cache/ms-playwright/ffmpeg-*
          key: playwright-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install OS dependencies and verify matching browser revision
        run: |
          # APT needs lowercase proxy variables, including after sudo. Do not
          # print their values: a configured proxy can contain credentials.
          export http_proxy="${http_proxy:-${HTTP_PROXY:-}}"
          export https_proxy="${https_proxy:-${HTTPS_PROXY:-}}"
          export no_proxy="${no_proxy:-${NO_PROXY:-}}"
          # Use direct HTTPS sources rather than mirror+file redirects. Keep
          # suites, components and Signed-By unchanged; never disable signing.
          sudo python3 - <<'PY'
          from pathlib import Path
          sources = [Path('/etc/apt/sources.list')]
          directory = Path('/etc/apt/sources.list.d')
          sources.extend(directory.glob('*.list'))
          sources.extend(directory.glob('*.sources'))
          for source in sources:
              if not source.is_file():
                  continue
              original = source.read_text()
              updated = original.replace('mirror+file:/etc/apt/apt-mirrors.txt', 'https://archive.ubuntu.com/ubuntu')
              updated = updated.replace('mirror+file:/etc/apt/apt-security-mirrors.txt', 'https://security.ubuntu.com/ubuntu')
              if updated != original:
                  source.write_text(updated)
          Path('/etc/apt/apt.conf.d/80entropy-browser-ci').write_text(
              'Acquire::Retries "2";\nAcquire::http::Timeout "10";\n'
              'Acquire::https::Timeout "10";\nAPT::Update::Error-Mode "any";\n')
          PY
          sudo --preserve-env=http_proxy,https_proxy,no_proxy,SSL_CERT_FILE,SSL_CERT_DIR,REQUESTS_CA_BUNDLE \
            /tmp/entropy-browser-tests/bin/python -m playwright install-deps ${{ matrix.browser }}
          /tmp/entropy-browser-tests/bin/python -m playwright install ${{ matrix.browser }}
        if: needs.plan.outputs.mode == 'full'
      - name: Test browser-local certificate generation and Go TLS interoperability
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_certificates_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/certificates
        if: needs.plan.outputs.mode == 'full'
      - name: Provide a virtual audio output for headless Firefox
        if: needs.plan.outputs.mode == 'full' && (matrix.browser == 'firefox')
        run: |
          export http_proxy="${http_proxy:-${HTTP_PROXY:-}}"
          export https_proxy="${https_proxy:-${HTTPS_PROXY:-}}"
          export no_proxy="${no_proxy:-${NO_PROXY:-}}"
          sudo --preserve-env=http_proxy,https_proxy,no_proxy,SSL_CERT_FILE,SSL_CERT_DIR,REQUESTS_CA_BUNDLE apt-get update
          sudo --preserve-env=http_proxy,https_proxy,no_proxy,SSL_CERT_FILE,SSL_CERT_DIR,REQUESTS_CA_BUNDLE \
            apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=entropy_test_output
          pactl set-default-sink entropy_test_output
      - name: Test appearance, window restoration and responsive layout
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_theme_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/theme
        if: needs.plan.outputs.mode == 'full'
      - name: Test source and socket controls with fake media
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_sources_browser.py --browser ${{ matrix.browser }} --chromium '' --artifacts browser-artifacts/sources
        if: needs.plan.outputs.mode == 'full'
      - name: Test structure, spectral history and PCM diagnostic views
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_diagnostics_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/diagnostics
        if: needs.plan.outputs.mode == 'full'
      - name: Test graph palettes, persistence and raw-data invariance
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_graph_palettes_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/palettes
        if: needs.plan.outputs.mode == 'full'
      - name: Test interface languages, saved choices and payload invariance
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_ui_languages_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/languages
        if: needs.plan.outputs.mode == 'full'
      - name: Test installed interface language subsets and removal fallback
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_installed_ui_locales_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/installed-ui-locales
        if: needs.plan.outputs.mode == 'full'
      - name: Test compressed static assets and versioned catalog cache reuse
        env:
          DEBUG: pw:browser
        run: /tmp/entropy-browser-tests/bin/python scripts/test_static_assets_browser.py --browser ${{ matrix.browser }} --artifacts browser-artifacts/static-assets
        if: needs.plan.outputs.mode == 'full'
      - name: Upload browser evidence
        if: needs.plan.outputs.mode == 'full' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-ui-${{ matrix.browser }}
          path: browser-artifacts/
          retention-days: 7
          if-no-files-found: ignore
    needs:
      - plan
    if: always()
