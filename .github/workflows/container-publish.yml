name: Publish tested container images

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      source_sha:
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: GHCR publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout publishing code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download only this run's tested image archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-images-*
          path: tested-images
      - name: Download offline bundles when produced by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: container-oci-bundles
          path: tested-images
      - name: Install exact OCI publication transport
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Set up Buildx for image indexes
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install the OCI artifact client for SBOM attachments
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the validated images without rebuilding
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 scripts/publish_containers.py --repository "$GITHUB_REPOSITORY" \
            --tag "$IMAGE_TAG" --source-sha "$SOURCE_SHA" \
            --artifacts tested-images

  latest:
    name: Reconcile the stable latest channel
    needs: publish
    if: startsWith(inputs.tag, 'v') && !contains(inputs.tag, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ghcr-latest-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout promotion code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve current stable release and promote validated indexes by digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/promote_latest_containers.py --repository "$GITHUB_REPOSITORY"
