name: Publish tested container images

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      source_sha:
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: GHCR publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout publishing code
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Download only this run's tested image archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-images-*
          path: tested-images
      - name: Set up Buildx for image indexes
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the validated images without rebuilding
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_latest=false
          if [[ "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [[ "$latest_release" == "$IMAGE_TAG" ]]; then publish_latest=true; fi
          fi
          python3 scripts/publish_containers.py --repository "$GITHUB_REPOSITORY" \
            --tag "$IMAGE_TAG" --source-sha "$SOURCE_SHA" \
            --artifacts tested-images --latest "$publish_latest"
