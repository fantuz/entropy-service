name: Recover validated release publication

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      validated_run_id:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-recovery-${{ github.repository }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  recover:
    name: Publish the unchanged validated tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - name: Checkout reviewed publication tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - name: Verify original validation evidence and immutable source
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VALIDATED_RUN: ${{ inputs.validated_run_id }}
        run: |
          python3 tools/scripts/validate_release_recovery.py --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --run-id "$VALIDATED_RUN"
      - name: Checkout the exact original release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.validation.outputs.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Select the original tag's native packaging method
        id: packaging
        working-directory: source
        env:
          RELEASE_VERSION: ${{ steps.validation.outputs.version }}
          SOURCE_SHA: ${{ steps.validation.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = "$RELEASE_VERSION"
          if [[ -f scripts/native_release.py ]]; then
            echo 'method=artifact' >> "$GITHUB_OUTPUT"
          else
            echo 'method=goreleaser' >> "$GITHUB_OUTPUT"
          fi
      - name: Download original tested native packages
        if: steps.packaging.outputs.method == 'artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-release-payloads
          run-id: ${{ inputs.validated_run_id }}
          github-token: ${{ github.token }}
          path: source/bin/native-release
      - name: Download the exact GUI artifact qualified by both Windows runners
        if: steps.validation.outputs.gui_artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.validation.outputs.gui_artifact_id }}
          run-id: ${{ inputs.validated_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: source/bin/gui-release
      - name: Download GUI assets tested in the original single-job workflow
        if: steps.validation.outputs.gui_artifact_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-gui-installer-and-sources
          run-id: ${{ inputs.validated_run_id }}
          github-token: ${{ github.token }}
          path: source/bin/gui-release
      - name: Download original offline OCI bundles when available
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: container-oci-bundles
          run-id: ${{ inputs.validated_run_id }}
          github-token: ${{ github.token }}
          path: source/bin/oci-release-download/container-oci-bundles
          merge-multiple: true
      - name: Verify exact GUI bytes and prepare relative publication globs
        if: steps.packaging.outputs.method == 'goreleaser'
        env:
          RELEASE_VERSION: ${{ steps.validation.outputs.version }}
          SOURCE_SHA: ${{ steps.validation.outputs.sha }}
        working-directory: source
        run: |
          oci_options=()
          if [[ -f scripts/oci_release.py ]]; then
            oci_options=(--oci-artifacts bin/oci-release-download/container-oci-bundles --repository "$GITHUB_REPOSITORY")
          fi
          python3 ../tools/scripts/prepare_gui_release.py prepare --artifacts bin/gui-release "${oci_options[@]}" \
            --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/goreleaser-recovery.yml"
          test -z "$(git status --porcelain)"
      - name: Verify original native, GUI and OCI assets and prepare publication
        if: steps.packaging.outputs.method == 'artifact'
        working-directory: source
        env:
          RELEASE_VERSION: ${{ steps.validation.outputs.version }}
          SOURCE_SHA: ${{ steps.validation.outputs.sha }}
        run: |
          python3 ../tools/scripts/native_release.py prepare --native bin/native-release --gui bin/gui-release \
            --oci-artifacts bin/oci-release-download/container-oci-bundles --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/goreleaser-recovery.yml"
          test -z "$(git status --porcelain)"
      - name: Setup matching Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: source/go.mod
      - name: Publish original tag with its verified configuration
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.17.0
          workdir: source
          args: release --clean --config "${{ runner.temp }}/goreleaser-recovery.yml" --release-notes=docs/releases/${{ inputs.release_tag }}.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.release_tag }}
      - name: Download original tested container archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-images-*
          run-id: ${{ inputs.validated_run_id }}
          github-token: ${{ github.token }}
          path: source/tested-images
      - name: Download original OCI publication bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: container-oci-bundles
          run-id: ${{ inputs.validated_run_id }}
          github-token: ${{ github.token }}
          path: source/tested-images/container-oci-bundles
          merge-multiple: true
      - name: Install OCI publication transport
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Set up image-index publication
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install OCI source/SBOM attachment client
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the original tested images without rebuilding
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ steps.validation.outputs.sha }}
        run: |
          python3 scripts/publish_containers.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" --artifacts tested-images
  latest:
    name: Reconcile the stable latest channel
    needs: recover
    if: startsWith(inputs.release_tag, 'v') && !contains(inputs.release_tag, '-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-latest-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout current promotion tools
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up image indexes
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reconcile latest using the original shared stable lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/promote_latest_containers.py --repository "$GITHUB_REPOSITORY"
